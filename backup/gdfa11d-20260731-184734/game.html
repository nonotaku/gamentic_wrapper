  var c=this.cx;c.clearRect(0,0,SW,SH);

  for(var i=0;i<SPX;i++){

      else if(bot||rgt){c.fillStyle='rgba(6,8,14,'+(0.6*et).toFixed(3)+')';c.fillRect(jx,jy,1,1);}

function drawPlayer(c,p){

  /* engine drop shadow — unpaintable, the core tell */
  var C=window.GAME_CONFIG,lt=lightAt(X+SW/2,Y+SH);

  }
  c.drawImage(p.cv,X,Y);
  var _now=performance.now();
  if(!p.nextBlink)p.nextBlink=_now+1000+Math.random()*4000;
  if(_now>=p.nextBlink){
    if(!p.blinkEnd)p.blinkEnd=_now+300;
    if(_now<p.blinkEnd)drawEyes(c,X,Y,p.pose);
    else{p.nextBlink=_now+1800+Math.random()*4200;p.blinkEnd=0;}

function lightAt(pxx,pyy){
  var C=window.GAME_CONFIG;
  for(var i=0;i<LIGHTZONES.length;i++){
    var z=LIGHTZONES[i];
    if(pxx>=z.x&&pxx<z.x+z.w&&pyy>=z.y&&pyy<z.y+z.h)return z.dark?C.darkZoneLight:(z.l||1);
  }
  return 1;
}
function exposureAt(pxx,pyy){
  var C=window.GAME_CONFIG,l=lightAt(pxx,pyy);
  var tx=(pxx/16)|0,ty=(pyy/16)|0,solids=0,tot=0;
  for(var y=ty-2;y<=ty+2;y++)for(var x=tx-2;x<=tx+2;x++){tot++;if(tget(x,y)===1)solids++;}
  var open=1-solids/tot;
  var e=l*0.65+open*0.35;
  return clamp(0.5+e*(C.exposureMaxMul-0.5),0.5,C.exposureMaxMul);
}

function peApply(cell,tool){
  var m=LP.mask(),d=LP.data;
  function put(x,y){
    if(x<0||x>=SW||y<0||y>=SH)return;
    var i=y*SW+x;
    if(m[i])d[i]=PE.cur;
  }
  if(tool==='pencil')put(cell.x,cell.y);
  else if(tool==='brush2'){put(cell.x,cell.y);put(cell.x+1,cell.y);put(cell.x,cell.y+1);put(cell.x+1,cell.y+1);}
  else if(tool==='brush3'){for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++)put(cell.x+dx,cell.y+dy);}
  else if(tool==='fill'){
    if(!m[cell.i])return;
    var tgt=d[cell.i];if(tgt===PE.cur)return;
    var q=[cell.i],seen={};
    while(q.length){
      var i=q.pop();if(seen[i])continue;seen[i]=1;
      if(!m[i]||d[i]!==tgt)continue;
      d[i]=PE.cur;
      var x=i%SW,y=(i/SW)|0;
      if(x>0)q.push(i-1);if(x<SW-1)q.push(i+1);if(y>0)q.push(i-SW);if(y<SH-1)q.push(i+SW);
    }
  }
  LP.dirtyCv=true;spriteDirty=true;
}
function peLine(a,b){
  var m=LP.mask(),d=LP.data;
  var dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y),sx=a.x<b.x?1:-1,sy=a.y<b.y?1:-1,err=dx-dy,x=a.x,y=a.y;
  for(;;){
    var i=y*SW+x;if(m[i])d[i]=PE.cur;
    if(x===b.x&&y===b.y)break;
    var e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
  }
  LP.dirtyCv=true;spriteDirty=true;
}

function peDraw(){
  if(!PE.open)return;
  var ec=$('edCanvas'),c=ec.getContext('2d'),z=PE.zoom;
  c.imageSmoothingEnabled=false;
  /* background behind the sprite, at editor zoom */
  var wx=Math.round(LP.x),wy=Math.round(LP.y);
  c.drawImage(bgCanvas,wx,wy,SW,SH,0,0,SW*z,SH*z);
  var m=LP.mask(),d=LP.data,i,x,y,X,Y;
  /* optional dim outside the silhouette (off by default so background colour stays true) */
  if(PE.maskView===1){
    for(i=0;i<SPX;i++){
      if(m[i])continue;
      x=i%SW;y=(i/SW)|0;
      c.fillStyle=((x+y)&1)?'rgba(6,8,12,0.30)':'rgba(6,8,12,0.45)';
      c.fillRect(x*z,y*z,z,z);
    }
  }
  for(i=0;i<SPX;i++){
    if(!m[i])continue;
    x=i%SW;y=(i/SW)|0;
    var v=d[i];
    c.fillStyle=v<32?PAL[v]:((LP.warn&&LP.warn[i])?'#ff6bb3':'#ffffff');
    c.fillRect(x*z,y*z,z,z);
  }
  /* room light applied to sprite AND background together — exactly what a seeker sees.
     PE.lit=1 lifts it so you can read a dark wall's pattern; the eyedropper still samples
     the true (unlit) colour either way, so matching stays accurate. */
  var lt=lightAt(wx+12,wy+16);
  if(lt<1&&!PE.lit){c.fillStyle='rgba(10,12,20,'+(0.85*(1-lt)).toFixed(3)+')';c.fillRect(0,0,SW*z,SH*z);}
  if(lt<1&&PE.lit){c.fillStyle='rgba(255,236,140,0.05)';c.fillRect(0,0,SW*z,SH*z);}
  /* silhouette edge marker (UI — drawn after the light so it stays readable) */
  if(PE.maskView!==2){
    c.lineWidth=1;
    c.strokeStyle='rgba(0,0,0,0.55)';
    for(var pass=0;pass<2;pass++){
      if(pass)c.strokeStyle='rgba(255,255,255,0.6)';
      var o=pass?0.5:1.5;
      c.beginPath();
      for(i=0;i<SPX;i++){
        if(!m[i])continue;
        x=i%SW;y=(i/SW)|0;X=x*z;Y=y*z;
        if(y===0||!m[i-SW]){c.moveTo(X,Y+o);c.lineTo(X+z,Y+o);}
        if(y===SH-1||!m[i+SW]){c.moveTo(X,Y+z-o);c.lineTo(X+z,Y+z-o);}
        if(x===0||!m[i-1]){c.moveTo(X+o,Y);c.lineTo(X+o,Y+z);}
        if(x===SW-1||!m[i+1]){c.moveTo(X+z-o,Y);c.lineTo(X+z-o,Y+z);}
      }
      c.stroke();
    }
  }
  if(z>=8){
    c.strokeStyle='rgba(0,0,0,0.12)';
    for(var gx=0;gx<=SW;gx++){c.beginPath();c.moveTo(gx*z+0.5,0);c.lineTo(gx*z+0.5,SH*z);c.stroke();}
    for(var gy=0;gy<=SH;gy++){c.beginPath();c.moveTo(0,gy*z+0.5);c.lineTo(SW*z,gy*z+0.5);c.stroke();}
  }
  if(PE.lineFrom&&PE.hover){
    c.strokeStyle='#39e6a0';c.lineWidth=2;
    c.beginPath();c.moveTo(PE.lineFrom.x*z+z/2,PE.lineFrom.y*z+z/2);c.lineTo(PE.hover.x*z+z/2,PE.hover.y*z+z/2);c.stroke();c.lineWidth=1;
  }
  if(PE.hover&&!PE.lineFrom){
    c.strokeStyle='rgba(255,255,255,0.8)';
    c.strokeRect(PE.hover.x*z+0.5,PE.hover.y*z+0.5,z-1,z-1);
  }
  var un=LP.unpaintedCount();
  var w=$('unWarn');
  w.textContent=un.n>0?('! '+un.n+' / '+un.t+' pixels unpainted'):'OK fully painted ('+un.t+' px)';
  w.style.color=un.n>un.t*0.4?'#ff8a7b':(un.n>0?'#ffce73':'#7bf5c0');
}

function hbTest(nx,ny){
  var x0=((nx+5)/16)|0,x1=((nx+18.99)/16)|0,y0=((ny+2)/16)|0,y1=((ny+31.99)/16)|0;
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++)if(tget(tx,ty)===1)return true;
  return false;
}
function onLadder(p){
  var x0=((p.x+8)/16)|0,x1=((p.x+15)/16)|0,y0=((p.y+4)/16)|0,y1=((p.y+31)/16)|0;
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++)if(tget(tx,ty)===2)return true;
  return false;
}
function movePlayer(dt){
  var C=window.GAME_CONFIG;
  if(!LP.alive||Game.phase==='reveal')return;
  if(LP.locked||PE.open||Game.poseOpen)return;
  var sp=C.walkSpeed*(LP.role==='seeker'&&LP.inspecting?C.inspectSlowMul:1);
  var ax=0;
  if(keys.KeyA)ax-=1;if(keys.KeyD)ax+=1;
  LP.vx+=ax*C.accel*dt;
  var fr=Math.max(0,1-C.friction*dt/Math.max(sp,1)*90);
  if(!ax)LP.vx*=Math.max(0,1-C.friction*dt/60);
  LP.vx=clamp(LP.vx,-sp,sp);
  var lad=onLadder(LP);
  var wallL=hbTest(LP.x-1,LP.y),wallR=hbTest(LP.x+1,LP.y);
  if(lad&&(keys.KeyW||keys.KeyS||LP.climbing)){
    LP.climbing=true;LP.sticking=false;LP.vy=0;
    var cy=0;if(keys.KeyW)cy-=1;if(keys.KeyS)cy+=1;
    var ny=LP.y+cy*C.climbSpeed*dt;
    if(!hbTest(LP.x,ny))LP.y=ny;else LP.climbing=false;
    if(!onLadder(LP))LP.climbing=false;
    if(keys.Space&&!hbTest(LP.x,LP.y-2)){LP.climbing=false;LP.vy=-C.jumpVel*0.7;}
  }else if(C.wallClimb!==false&&LP.climbMode){
    /* climb mode: crawl along any wall or ceiling with WASD */
    var touching=true; /* free climb — no surface contact needed, solids still block */
    if(touching){
      if(!LP.sticking){LP.sticking=true;AudioSys.sfx('sfx_lock',0.3);}
      LP.climbing=false;LP.vy=0;LP.vx=0;
      if(keys.Space){LP.climbMode=false;LP.sticking=false;LP.vy=-C.jumpVel*0.85;AudioSys.sfx('sfx_jump',0.5);if(climbTag)climbTag.style.display='none';toast('Climb mode OFF');}
      else{
        var mx2=0,my2=0;
        if(keys.KeyA)mx2-=1;if(keys.KeyD)mx2+=1;
        if(keys.KeyW)my2-=1;if(keys.KeyS)my2+=1;
        if(mx2){var nx3=LP.x+mx2*C.climbSpeed*dt;if(!hbTest(nx3,LP.y)){LP.x=nx3;LP.lastMove=performance.now();LP.moving=true;}}
        if(my2){var ny3=LP.y+my2*C.climbSpeed*dt;if(!hbTest(LP.x,ny3)){LP.y=ny3;LP.lastMove=performance.now();LP.moving=true;}}
      }
      if(LP.sticking)LP.grounded=false;
    }else{
      LP.sticking=false;
      LP.vy+=C.gravity*dt;
    }
  }else{
    LP.sticking=false;
    LP.climbing=false;
    LP.vy+=C.gravity*dt;
    if(keys.Space&&LP.grounded){LP.vy=-C.jumpVel;LP.grounded=false;AudioSys.sfx('sfx_jump',0.5);}
  }
  /* x axis */
  var nx=LP.x+LP.vx*dt;
  if(!hbTest(nx,LP.y))LP.x=nx;else{
    var s=Math.sign(LP.vx);
    while(Math.abs(nx-LP.x)>0.5&&hbTest(nx,LP.y))nx-=s*0.5;
    if(!hbTest(nx,LP.y))LP.x=nx;
    LP.vx=0;
  }
  /* y axis */
  if(!LP.climbing){
    var ny2=LP.y+LP.vy*dt;
    if(!hbTest(LP.x,ny2)){LP.y=ny2;LP.grounded=false;}
    else{
      var sy=Math.sign(LP.vy);
      while(Math.abs(ny2-LP.y)>0.5&&hbTest(LP.x,ny2))ny2-=sy*0.5;
      if(!hbTest(LP.x,ny2))LP.y=ny2;
      if(sy>0)LP.grounded=true;
      LP.vy=0;
    }
  }
  LP.x=clamp(LP.x,0,LEVW-SW);LP.y=clamp(LP.y,0,LEVH-SH);
  if(Math.abs(LP.vx)>4||Math.abs(LP.vy)>4||LP.climbing){LP.lastMove=performance.now();LP.moving=true;}
  else LP.moving=false;
}

function updateCamera(dt){
  var C=window.GAME_CONFIG;
  var z=(LP.role==='seeker'&&LP.inspecting&&Game.phase==='hunt')?C.inspectZoom:1;
  CAM.zoom+=(z-CAM.zoom)*Math.min(1,dt*8);
  if(Math.abs(CAM.zoom-z)<0.02)CAM.zoom=z;
  var vw=480/CAM.zoom,vh=270/CAM.zoom;
  var tx=LP.x+SW/2-vw/2,ty=LP.y+SH/2-vh/2;
  if(LP.inspecting){
    tx+=(MOUSE.sx-240)*0.6/CAM.zoom;ty+=(MOUSE.sy-135)*0.6/CAM.zoom;
  }
  if(Game.phase==='prep'&&LP.role==='seeker'){
    var cl=SPAWNS.closet;
    tx=cl.x+cl.w/2-vw/2;ty=cl.y+cl.h/2-vh/2;
  }
  tx=clamp(tx,0,LEVW-vw);ty=clamp(ty,0,LEVH-vh);
  var k=Math.min(1,dt*7);
  CAM.x+=(tx-CAM.x)*k;CAM.y+=(ty-CAM.y)*k;
}

function drawPoseWheel(){
  var cv=$('poseCanvas'),c=cv.getContext('2d'),n=POSES.length,cx=180,cy=180;
  c.clearRect(0,0,360,360);
  for(var i=0;i<n;i++){

    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,168,a0,a1);c.closePath();
    c.fillStyle=i===POSEW.hover?'rgba(57,230,160,0.35)':(i===LP.pose?'rgba(57,110,90,0.5)':'rgba(20,26,40,0.9)');
    c.fill();c.strokeStyle='#2a3550';c.stroke();
    c.font='26px serif';c.textAlign='center';c.fillStyle='#fff';
    var _im=POSES[i].mask,_ix=cx+Math.cos(am)*118,_iy=cy+Math.sin(am)*118;c.fillStyle=i===POSEW.hover?'#ffffff':(i===LP.pose?'#c9ffe9':'#aeb9d4');for(var _py=0;_py<32;_py++)for(var _px=0;_px<24;_px++){if(_im[_py*24+_px])c.fillRect(Math.round(_ix-12+_px),Math.round(_iy-16+_py),1,1);}
    c.font='11px Consolas,monospace';c.fillStyle=i===POSEW.hover?'#c9ffe9':'#9fb2d8';
    c.fillText(POSES[i].name,cx+Math.cos(am)*72,cy+Math.sin(am)*72+4);
  }
  c.beginPath();c.arc(cx,cy,40,0,7);c.fillStyle='rgba(10,14,22,0.94)';c.fill();c.strokeStyle='#2a3550';c.stroke();
  c.fillStyle='#dfe7f5';c.font='11px Consolas,monospace';c.fillText('POSE',cx,cy-2);

/* keys */
addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='F3'){e.preventDefault();window.GAME_CONFIG.debugPanel=!window.GAME_CONFIG.debugPanel;return;}
  if(Game.phase==='lobby'){if(LobbyUI.onKey&&LobbyUI.onKey(e))return;return;}
  if(!LP)return;
  if(e.code==='KeyF'){
    if(PE.open)closePaint();
    else if((Game.phase==='prep'||Game.phase==='practice')&&(LP.role==='hider'))openPaint();
    else if(Game.phase==='hunt'&&LP.role==='hider')toast('No repainting mid-hunt — relocate first');
  }
  else if(e.code==='KeyR'&&!PE.open)togglePoseWheel();
  else if(e.code==='ShiftLeft'&&!e.repeat&&!PE.open)toggleLock();
  else if(e.code==='KeyC'&&!e.repeat&&!PE.open)toggleClimbMode();
  else if(e.code==='KeyE'&&!e.repeat&&LP.role==='seeker'&&Game.phase==='hunt'&&LP.alive){
    LP.inspecting=!LP.inspecting;
    $('inspectTag').style.display=LP.inspecting?'block':'none';
    AudioSys.sfx('sfx_click',0.5);
  }
  else if(e.code==='ArrowLeft'){e.preventDefault();nudge(-1,0);}
  else if(e.code==='ArrowRight'){e.preventDefault();nudge(1,0);}
  else if(e.code==='ArrowUp'){e.preventDefault();nudge(0,-1);}
  else if(e.code==='ArrowDown'){e.preventDefault();nudge(0,1);}
  else if(e.code==='KeyZ'&&(e.ctrlKey||e.metaKey)&&PE.open){e.preventDefault();peUndo();}
  else if(e.code==='KeyY'&&(e.ctrlKey||e.metaKey)&&PE.open){e.preventDefault();peRedo();}
  else if(e.code==='Escape'){
    if(PE.open)closePaint();
    else if(Game.poseOpen)togglePoseWheel(false);
    else if(Game.phase==='practice')leaveToMenu();
  }
  if(e.code==='Space'&&!PE.open)e.preventDefault();
});

function wireIceLog(w,tag){
  var pc=w.pc;
  w.cands={host:0,srflx:0,relay:0,prflx:0};
  pc.addEventListener('icecandidate',function(e){
    if(e.candidate){
      var m=String(e.candidate.candidate||'').match(/ typ (\w+)/);
      var ty=m?m[1]:'?';
      if(w.cands[ty]!==undefined)w.cands[ty]++;
      if(w.cands[ty]===1)nlog(tag+' got first '+ty.toUpperCase()+' candidate');
    }else nlog(tag+' local gathering DONE '+candSummary(w));
  });
  pc.addEventListener('icecandidateerror',function(e){
    nlog('ICE SERVER ERR '+e.errorCode+' @'+(e.url||'?')+' '+(e.errorText||''));
  });
  pc.addEventListener('icegatheringstatechange',function(){nlog('gather -> '+pc.iceGatheringState);});
}
function candSummary(w){
  if(!w||!w.cands)return '';
  var c=w.cands;
  return '(host '+c.host+', srflx '+c.srflx+', relay '+c.relay+')';
}
function roomPid(name,pass){
  var s=name.toLowerCase().trim()+''+pass,h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return 'pp2h'+(h>>>0).toString(36);
}
var NET={

        else{p.ent.role=s.role;p.ent.alive=s.alive;}
      });
      Roster.order.slice().forEach(function(id){if(!seen[id])Roster.remove(id);});
      applyCfg(m.cfg);LobbyUI.refresh&&LobbyUI.refresh();
      hudTop();
      break;}
    case 'pi':NET.sendRel({t:'po',ts:m.ts});break;
    case 'po':if(NET.host)NET.host.ping=Math.round(performance.now()-m.ts);break;
    case 'spr':{var p3=Roster.get(m.pid);if(p3)p3.ent.applySprite(m.d,m.pose);break;}
    case 'pose':{var p4=Roster.get(m.pid);if(p4)p4.ent.setPose(m.pose);break;}
    case 'lock':{var p5=Roster.get(m.pid);if(p5&&p5.id!==LP.id){p5.ent.locked=!!m.on;if(m.on){p5.ent.x=m.x;p5.ent.y=m.y;p5.ent.setPose(m.pose);p5.ent.buf=[];}}break;}
    case 'tagRes':applyTagRes(m);break;
    case 'start':clientStart(m);break;
    case 'phase':if(m.n==='hunt')localPhaseHunt();break;
    case 'score':{var p6=Roster.get(m.pid);if(p6)p6.score=m.score;if(m.pid===LP.id){LP.score=m.score;if(m.pop)scorePop(m.pop);}break;}
    case 'reveal':startReveal(m.list);break;
    case 'backLobby':backToLobby(m.players);break;
    case 'hostBye':toast('Host closed the room',4000);leaveToMenu();break;
  }
}

var TAGFX=[];
function hostHandleEvent(pid,m){
  var C=window.GAME_CONFIG,p=Roster.get(pid);
  if(!p)return;
  switch(m.t){
    case 'pose':
      if(pid!==LP.id)p.ent.setPose(m.pose);
      NET.bcast({t:'pose',pid:pid,pose:m.pose},pid);
      break;
    case 'lock':
      if(pid!==LP.id){
        p.ent.locked=!!m.on;
        if(m.on){p.ent.x=m.x;p.ent.y=m.y;p.ent.setPose(m.pose);p.ent.buf=[];}
      }
      if(m.on){
        var e=pid===LP.id?LP:p.ent;
        p.expo=exposureAt(e.x+SW/2,e.y+SH/2);
      }
      NET.bcast({t:'lock',pid:pid,on:m.on,x:m.x,y:m.y,pose:m.pose},pid);
      break;
    case 'spr':
      if(pid!==LP.id)p.ent.applySprite(m.d,m.pose);
      NET.bcast({t:'spr',pid:pid,d:m.d,pose:m.pose},pid);
      break;
    case 'tagTry':
      if(p.role!=='seeker'||!p.alive||Game.phase!=='hunt')return;
      var now=performance.now();
      if(now-p.lastTag<C.tagCooldown*1000)return;
      p.lastTag=now;
      var best=null,bd=1e9;
      Roster.all().forEach(function(h){
        if(h.role!=='hider'||!h.alive)return;
        var e2=h.id===LP.id?LP:h.ent;
        if(m.x>=e2.x-1&&m.x<=e2.x+SW+1&&m.y>=e2.y-1&&m.y<=e2.y+SH+1){
          var d=Math.abs(m.x-(e2.x+SW/2))+Math.abs(m.y-(e2.y+SH/2));
          if(d<bd){bd=d;best=h;}
        }
      });
      var res;
      if(best){
        best.alive=false;best.found=true;best.foundBy=p.name;best.caughtAt=performance.now();
        if(best.id!==LP.id){best.ent.alive=false;}
        p.finds++;p.score+=C.findPts;p.rs.finds=(p.rs.finds||0)+C.findPts;
        pushScore(p,'+'+C.findPts+' FOUND '+best.name);
        res={t:'tagRes',by:pid,hit:1,pid:best.id,x:m.x,y:m.y};
        if(C.mode==='infection')scheduleInfection(best.id);
      }else{
        res={t:'tagRes',by:pid,hit:0,x:m.x,y:m.y};
      }
      NET.bcast(res);
      applyTagRes(res);
      bcastRoom();
      checkRoundEnd();
      break;
  }
}
function scheduleInfection(hid){

/* rounds */
function chooseSeekers(all,nSeek,mode){
  var pick={},i;
  function cnt(){return Object.keys(pick).length;}
  function randomFill(){
    var pool=all.filter(function(p){return !pick[p.id];});
    for(var a=pool.length-1;a>0;a--){var b=(Math.random()*(a+1))|0,t=pool[a];pool[a]=pool[b];pool[b]=t;}
    for(var k=0;k<pool.length&&cnt()<nSeek;k++)pick[pool[k].id]=1;
  }
  if(!Game.picked)Game.picked={};
  if(mode==='host'){
    all.forEach(function(p){if(Game.picked[p.id])pick[p.id]=1;});
    if(cnt()>=all.length){delete pick[Object.keys(pick)[0]];}
    if(!cnt())randomFill();
  }else if(mode==='volunteer'){
    all.forEach(function(p){if(p.volunteer)pick[p.id]=1;});
    if(cnt()>=all.length){var ids=Object.keys(pick);delete pick[ids[(Math.random()*ids.length)|0]];}
    if(!cnt())randomFill();
  }else if(mode==='rotate'){
    if(!Game.rota)Game.rota={};
    var uns=all.filter(function(p){return !Game.rota[p.id];});
    if(uns.length<nSeek){Game.rota={};uns=all.slice();}
    for(i=0;i<uns.length&&cnt()<nSeek;i++){pick[uns[i].id]=1;Game.rota[uns[i].id]=1;}
  }else if(mode==='caught'){
    var hasAll=all.length&&all.every(function(p){return typeof p.lastSurvival==='number';});
    if(!hasAll){randomFill();}
    else{var sorted=all.slice().sort(function(a,b){return a.lastSurvival-b.lastSurvival;});for(i=0;i<sorted.length&&cnt()<nSeek;i++)pick[sorted[i].id]=1;}
  }else{randomFill();}
  return pick;
}
function startRound(swap){
  var C=window.GAME_CONFIG;
  Game.roundIdx=swap?1:0;
  var all=Roster.all();
  var nSeek=clamp(Math.max(1,Math.round(all.length/C.seekerRatio)),1,all.length-1);
  var pool=all.slice();
  if(C.mode==='double'){
    var half=Math.max(1,Math.floor(all.length/2));
    pool.forEach(function(p,i){p.role=((i<half)!==!!swap)?'seeker':'hider';});
  }else{
    var seekers=chooseSeekers(all,nSeek,C.seekerPick||'random');
    all.forEach(function(p){p.role=seekers[p.id]?'seeker':'hider';});
    if(swap)all.forEach(function(p){p.role=p.role==='seeker'?'hider':'seeker';});
  }
  all.forEach(function(p){
    p.alive=true;p.found=false;p.misses=0;p.seenSec=0;p.expo=1;p.near={};p.rs={};p.lastTag=0;
  });
  Game.phase='prep';Game.tEnd=performance.now()+C.prepSeconds*1000;
  var roles=all.map(function(p){return[p.id,p.role];});
  NET.bcast({t:'start',roles:roles,mode:C.mode,prep:C.prepSeconds,hunt:C.huntSeconds,map:C.map});
  localStart(roles);
  bcastRoom();
}

var scoreAccT=0;
function hostTick(dt,now){
  var C=window.GAME_CONFIG;
  if(Game.phase==='prep'&&now>=Game.tEnd)hostBeginHunt();
  else if(Game.phase==='hunt'){
    if(now>=Game.tEnd){endHunt();return;}
    scoreAccT+=dt;
    if(scoreAccT>=0.2){
      var step=scoreAccT;scoreAccT=0;
      var seekers=Roster.all().filter(function(s){return s.role==='seeker'&&s.alive;});
      Roster.all().forEach(function(h){
        if(h.role!=='hider'||!h.alive)return;
        var e=h.id===LP.id?LP:h.ent;
        var hx=e.x,hy=e.y,seen=false;
        seekers.forEach(function(s){
          var cx=s.id===LP.id?CAM.x:s.camx,cy=s.id===LP.id?CAM.y:s.camy,cz=s.id===LP.id?CAM.zoom:(s.camz||1);
          var vw=480/cz,vh=270/cz;
          var ov=hx+SW>cx&&hx<cx+vw&&hy+SH>cy&&hy<cy+vh;
          if(ov)seen=true;
          var insp=s.id===LP.id?LP.inspecting:s.ent.inspecting;
          if(insp&&ov&&cz>1.3){
            if(h.near[s.id]===undefined)h.near[s.id]=0;
            if(h.near[s.id]>=0){
              h.near[s.id]+=step;
              if(h.near[s.id]>=1.2)h.near[s.id]=99;
            }
          }
          if(h.near[s.id]===99){
            var se=s.id===LP.id?LP:s.ent;
            var d=Math.hypot(se.x-hx,se.y-hy);
            if(d>240){
              h.near[s.id]=-1;
              h.rs.near=(h.rs.near||0)+C.nearMissBonus;h.score+=C.nearMissBonus;
              pushScore(h,'+'+C.nearMissBonus+' inspected & survived!');
            }
          }
        });
        if(seen){
          h.seenSec+=step;
          var pts=C.seenPerSec*step*h.expo;
          h.score+=pts;h.rs.seen=(h.rs.seen||0)+pts;
          h.popAcc=(h.popAcc||0)+pts;
          if(h.popAcc>=12){pushScore(h,'+'+Math.round(h.popAcc)+' hiding in sight');h.popAcc=0;}
        }
      });
    }
  }
}
function checkRoundEnd(){
  if(Game.phase!=='hunt'||!NET.isHost)return;
  var hA=0,sA=0;
  Roster.all().forEach(function(p){if(p.alive){if(p.role==='hider')hA++;else sA++;}});
  if(hA===0||sA===0)endHunt();
}
function endHunt(){
  var C=window.GAME_CONFIG;
  if(Game.phase!=='hunt')return;
  Game.phase='revealWait';
  Roster.all().forEach(function(p){
    if(p.role==='hider'){
      if(p.alive){p.rs.surv=C.survivalPts;p.score+=C.survivalPts;}
      p.lastSurvival=(p.found&&p.caughtAt)?(p.caughtAt-(Game.huntStart||0)):(C.huntSeconds*1000+1e6);
    }else p.lastSurvival=C.huntSeconds*1000+2e6;
    p.caughtAt=0;
  });
  var list=Roster.all().filter(function(p){return p.role==='hider';}).map(function(p){
    var e=p.id===LP.id?LP:p.ent;
    return{pid:p.id,name:p.name,found:p.found?1:0,by:p.foundBy||'',x:Math.round(e.x),y:Math.round(e.y),
      surv:Math.round(p.rs.surv||0),seen:Math.round(p.rs.seen||0),near:Math.round(p.rs.near||0),
      expo:+p.expo.toFixed(2),score:Math.round(p.score)};
  });
  Roster.all().forEach(function(p){pushScore(p);});
  NET.bcast({t:'reveal',list:list});

var OFF=mkCan(480,270),octx=OFF.getContext('2d'),view=null,vctx=null;
function fit(){
  var s=Math.max(1,Math.floor(Math.min(innerWidth/480,innerHeight/270)));
  view.style.width=(480*s)+'px';view.style.height=(270*s)+'px';
}
function render(now){
  octx.setTransform(1,0,0,1,0,0);
  octx.imageSmoothingEnabled=false;
  octx.fillStyle='#0a0d13';octx.fillRect(0,0,480,270);
  var z=CAM.zoom;
  octx.setTransform(z,0,0,z,-Math.round(CAM.x*z)/1,-Math.round(CAM.y*z)/1);
  octx.drawImage(bgCanvas,0,0);
  drawAnimProps(octx,now);
  /* players */
  Roster.all().forEach(function(p){
    var e=p.id===LP.id?LP:p.ent;
    if(p.id===LP.id){if(!LP.alive)return;}
    else if(!p.alive&&Game.phase!=='reveal')return;
    drawPlayer(octx,e);
    drawNameTag(octx,e===LP?LP:e);
  });
  /* tag fx */
  var tnow=performance.now();
  for(var i=TAGFX.length-1;i>=0;i--){
    var f=TAGFX[i],age=(tnow-f.t)/1000;
    if(age>1.1){TAGFX.splice(i,1);continue;}
    if(f.hit){
      octx.strokeStyle='rgba(255,43,94,'+(1-age)+')';
      var r=4+age*26;
      octx.strokeRect(f.x-r,f.y-r,r*2,r*2);
    }else{
      octx.strokeStyle='rgba(220,220,230,'+(0.9-age*0.8)+')';
      octx.beginPath();
      octx.moveTo(f.x-5,f.y-5);octx.lineTo(f.x+5,f.y+5);
      octx.moveTo(f.x+5,f.y-5);octx.lineTo(f.x-5,f.y+5);
      octx.stroke();
    }
  }
  drawRevealRings(octx);
  /* light zones */
  LIGHTZONES.forEach(function(zn){
    var l=zn.dark?window.GAME_CONFIG.darkZoneLight:(zn.l||1);
    if(l>=1)return;
    octx.fillStyle='rgba(10,12,20,'+(0.85*(1-l)).toFixed(3)+')';
    octx.fillRect(zn.x,zn.y,zn.w,zn.h);
  });
  /* seeker prep blackout */
  if(Game.phase==='prep'&&LP.role==='seeker'){
    var cl=SPAWNS.closet;
    octx.fillStyle='#05070b';
    octx.fillRect(-2000,-2000,4000+LEVW,2000+cl.y);
    octx.fillRect(-2000,cl.y+cl.h,4000+LEVW,2000);
    octx.fillRect(-2000,cl.y,2000+cl.x,cl.h);
    octx.fillRect(cl.x+cl.w,cl.y,2000+LEVW,cl.h);
    octx.setTransform(1,0,0,1,0,0);
    octx.fillStyle='#6c7ea8';octx.font='10px Consolas,monospace';octx.textAlign='center';
    octx.fillText('The hiders are painting… you see nothing.',240,20);
  }
  octx.setTransform(1,0,0,1,0,0);
  vctx.imageSmoothingEnabled=false;
  vctx.clearRect(0,0,480,270);
  vctx.drawImage(OFF,0,0);
}
/* ============ mouse ============ */
var lastTagLocal=0;
function initMouse(){
  view.addEventListener('pointermove',function(e){
    var r=view.getBoundingClientRect();
    MOUSE.sx=(e.clientX-r.left)/r.width*480;
    MOUSE.sy=(e.clientY-r.top)/r.height*270;
    var w=screenToWorld(MOUSE.sx,MOUSE.sy);
    MOUSE.wx=w.x;MOUSE.wy=w.y;
  });
  view.addEventListener('pointerdown',function(e){
    if(e.button!==0)return;
    if(Game.phase!=='hunt'||LP.role!=='seeker'||!LP.alive)return;
    var now=performance.now();
    if(now-lastTagLocal<window.GAME_CONFIG.tagCooldown*1000)return;
    lastTagLocal=now;
    var w=screenToWorld(MOUSE.sx,MOUSE.sy);
    netEvent({t:'tagTry',x:Math.round(w.x),y:Math.round(w.y)});
    if(!NET.on&&!NET.isHost)toast('No one to tag in practice');
  });
  view.addEventListener('contextmenu',function(e){e.preventDefault();});
}
/* ============ debug + telemetry ============ */
var FPS={n:0,t:0,v:60};
setInterval(function(){
  if(!NET.on)return;
  var ts=performance.now();
  if(NET.isHost){for(var k in NET.peers){var w=NET.peers[k];if(w.pid)wSend(w.rel,{t:'pi',ts:ts});}}
  else NET.sendRel({t:'pi',ts:ts});
},2000);
setInterval(function(){
  NET.stats.inS=NET.stats.in;NET.stats.outS=NET.stats.out;
  NET.stats.in=0;NET.stats.out=0;
},1000);
function updateDebug(){
  var C=window.GAME_CONFIG,el=$('debug');
  if(!C.debugPanel){el.style.display='none';return;}
  el.style.display='block';
  var s='FPS '+FPS.v+' · '+Game.phase+' · me='+LP.id+' ('+LP.role+')'
  +'\npos '+Math.round(LP.x)+','+Math.round(LP.y)+(LP.locked?' LOCKED':'')+' cam '+Math.round(CAM.x)+','+Math.round(CAM.y)+' z'+CAM.zoom.toFixed(1)
  +'\nnet '+(NET.on?(NET.isHost?'HOST':'CLIENT'):'off')+' in '+(NET.stats.inS/1024).toFixed(1)+'kB/s out '+(NET.stats.outS/1024).toFixed(1)+'kB/s';
  if(NET.isHost){for(var k in NET.peers){var w=NET.peers[k];s+='\n '+(w.pid||'?')+' '+(w.name||'')+' ping='+(w.ping|0)+' rel='+(w.rel?w.rel.readyState:'-');}}
  else if(NET.host)s+='\n host ping='+(NET.host.ping|0)+' rel='+(NET.host.rel?NET.host.rel.readyState:'-');
  if(C.debugShowHiders)s+='\n[hider highlight ON]';
  el.textContent=s;
}
setInterval(updateDebug,400);
setInterval(function(){
  console.log('__GI__'+JSON.stringify({type:'watch',values:{fps:FPS.v,phase:Game.phase,players:Roster.order.length,score:Math.round(LP?LP.score:0),kbIn:+(NET.stats.inS/1024).toFixed(1),kbOut:+(NET.stats.outS/1024).toFixed(1)}}));
},500);
/* ============ harness callbacks ============ */
window.__giOnChange=function(patch){
  var C=window.GAME_CONFIG;
  if('musicVolume' in patch||'soundEnabled' in patch)AudioSys.applyVol();
  if('debugPanel' in patch)updateDebug();
  if('showNames' in patch||'debugShowHiders' in patch){/* read live per frame */}
  if('edgeTell' in patch){if(typeof LP!=='undefined'&&LP)LP.dirtyCv=true;Roster.all().forEach(function(p){if(p.ent)p.ent.dirtyCv=true;});}
  if('map' in patch){buildLevel();var sp=SPAWNS.hiders[0];LP.x=sp[0];LP.y=sp[1];LP.vx=0;LP.vy=0;if(NET.isHost&&NET.on)bcastRoom();}
};
window.__giOnAction=function(key){
  if(key==='restartRound'){
    if(NET.isHost){Game.phase='lobby';startRound(false);}
    else if(Game.phase==='practice')startPractice();
    else toast('Only the host can restart');
  }else if(key==='skipPhase'){
    if(!NET.isHost){toast('Host only');return;}
    if(Game.phase==='prep')hostBeginHunt();
    else if(Game.phase==='hunt')endHunt();
  }else if(key==='backLobby'){
    if(NET.isHost&&NET.on){var snap=rosterSnap();NET.bcast({t:'backLobby',players:snap});backToLobby(snap);}
    else leaveToMenu();
  }
};
/* ============ init + main loop ============ */
function init(){
  view=$('view');view.width=480;view.height=270;
  vctx=view.getContext('2d');
  buildLevel();
  LP=new PlayerEnt('me',lsGet('name','You'));
  var sv=lsGet('sprite',null);
  if(sv&&sv.d){LP.applySprite(sv.d,sv.p);}
  var sp=SPAWNS.hiders[0];LP.x=sp[0];LP.y=sp[1];
  buildPaintUI();
  initPoseWheel();
  initMouse();
  LobbyUI.build();
  fit();
  addEventListener('resize',fit);
  AudioSys.music('bgm_menu');
  CAM.x=300;CAM.y=100;
  requestAnimationFrame(frame);
}
var lastT=performance.now(),menuPan=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-lastT)/1000,0.1);lastT=now;
  FPS.n++;if(now-FPS.t>1000){FPS.v=FPS.n;FPS.n=0;FPS.t=now;}
  view.style.cursor=(Game.phase==='hunt'&&LP.role==='seeker'&&LP.alive)?'crosshair':'default';
  if(Game.phase==='lobby'){
    menuPan+=dt*0.13;
    CAM.zoom=1;
    CAM.x=(LEVW-480)/2+(LEVW-500)/2*Math.sin(menuPan);
    CAM.y=120+90*Math.sin(menuPan*0.6);
    CAM.x=clamp(CAM.x,0,LEVW-480);CAM.y=clamp(CAM.y,0,LEVH-270);
  }else if(Game.phase==='reveal'){
    revealTick(dt);
  }else{
    if(!LP.alive&&Game.phase==='hunt'){
      var fs=170*dt;
      if(keys.KeyA)LP.x-=fs;if(keys.KeyD)LP.x+=fs;
      if(keys.KeyW)LP.y-=fs;if(keys.KeyS)LP.y+=fs;
      LP.x=clamp(LP.x,0,LEVW-SW);LP.y=clamp(LP.y,0,LEVH-SH);
    }else movePlayer(dt);
    updateCamera(dt);
  }
  interpRemotes();
  netPump(now);
  if(NET.isHost)hostTick(dt,now);
  if(PE.open){peDraw();drawSeekerPreview();}
  hudTick();
  render(now);
}
init();
</script>
